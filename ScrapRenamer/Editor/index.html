<!doctype html>
<html lang="ja">

<head>
	<meta charset="utf-8">
	<title>ScrapRenamer</title>

	<style>
		html,
		body,
		#container {
			width: 100%;
			height: 100%;
			margin: 0;
			overflow: hidden;
		}

		.path-decoration {
			color: #888 !important;
		}

		.path-decoration::after {
			margin-left: 1em;
			color: #888;
			content: attr(data-path);
		}

	</style>
</head>

<body>

	<div id="container"></div>

	<script src="monaco/vs/loader.js"></script>

	<script src="app.js"></script>

</body>

</html>
