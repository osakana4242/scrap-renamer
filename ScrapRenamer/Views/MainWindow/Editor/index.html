<!doctype html>
<html lang="ja">

<head>
	<meta charset="utf-8">
	<title>ScrapRenamer</title>

	<style>
		html,
		body,
		#container {
			width: 100%;
			height: 100%;
			margin: 0;
			overflow: hidden;
		}

		.path-decoration {
			color: #888 !important;
		}

		.path-decoration::after {
			margin-left: 4em;
			color: #888;
			content: attr(data-path);
		}

		.changed-line {
			color: #8888ff !important;
		}

		.error-line {
			color: #ff4444 !important;
		}

		.directory-icon::before {
			content: "📁";
			margin-right: 6px;
		}

		.file-icon::before {
			content: "📄";
			margin-right: 6px;
		}

		.directory-glyph {
			/* content: "📁"; */
			/* background: url(directory.svg) center center no-repeat; */
			/* background-size: 16px 16px; */
			background-color: #ff0000;
		    border-radius: 50%;
		}

		.file-glyph {
			/* content: "📄"; */
			/* background: url(file.svg) center center no-repeat; */
			/* background-size: 16px 16px; */
			background-color: #ff0000;
		    border-radius: 50%;
		}		 

	</style>
</head>

<body>

	<div id="container"></div>

	<script src="monaco/vs/loader.js"></script>

	<script src="app.js"></script>

</body>

</html>
